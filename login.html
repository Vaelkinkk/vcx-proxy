<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCX Proxy — Secure Access Panel</title>
<style>
  /* ============ RESET ============ */
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --red-1:#ff1744;
    --red-2:#ff4569;
    --bg:#08080e;
    --card-bg:rgba(16,16,28,.92);
    --border:rgba(255,255,255,.05);
    --text-dim:rgba(255,255,255,.4);
  }

  html,body{
    height:100%;
    background:var(--bg);
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:#fff;
    overflow-x:hidden;
  }

  /* ============ BACKGROUND ============ */
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    padding:24px;
  }

  /* radial glow layers */
  body::before{
    content:"";
    position:fixed;
    top:-20%; left:50%;
    transform:translateX(-50%);
    width:900px; height:900px;
    background:radial-gradient(circle, rgba(255,23,68,.18) 0%, rgba(255,23,68,0) 65%);
    pointer-events:none;
    animation:glowPulse 6s ease-in-out infinite;
  }
  body::after{
    content:"";
    position:fixed;
    bottom:-25%; right:-10%;
    width:700px; height:700px;
    background:radial-gradient(circle, rgba(255,69,105,.12) 0%, rgba(255,69,105,0) 70%);
    pointer-events:none;
    animation:glowPulse 8s ease-in-out infinite reverse;
  }

  @keyframes glowPulse{
    0%,100%{ opacity:.7; }
    50%{ opacity:1; }
  }

  /* fade in whole page on load */
  .page-wrap{
    animation:pageFade .8s ease both;
  }
  @keyframes pageFade{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  /* ============ LOGIN CARD ============ */
  .login-card{
    position:relative;
    width:100%;
    max-width:400px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:26px;
    padding:40px 32px 32px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
      0 20px 60px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.02),
      0 0 80px rgba(255,23,68,.06);
    animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) .1s both;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(24px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* live badge */
  .badge-live{
    position:absolute;
    top:20px; right:20px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    letter-spacing:.5px;
    font-weight:600;
    color:#2ee879;
    background:rgba(46,232,121,.08);
    border:1px solid rgba(46,232,121,.25);
    padding:5px 10px;
    border-radius:20px;
  }
  .badge-live .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:#2ee879;
    box-shadow:0 0 8px #2ee879;
    animation:dotBlink 1.6s ease-in-out infinite;
  }
  @keyframes dotBlink{
    0%,100%{ opacity:1; }
    50%{ opacity:.3; }
  }

  /* ============ HEADER ============ */
  .header{
    text-align:center;
    margin-bottom:32px;
  }
  .logo{
    width:64px; height:64px;
    margin:0 auto 18px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--red-1),var(--red-2));
    box-shadow:0 8px 30px rgba(255,23,68,.45);
    animation:logoGlow 3s ease-in-out infinite;
  }
  @keyframes logoGlow{
    0%,100%{ box-shadow:0 8px 30px rgba(255,23,68,.45); }
    50%{ box-shadow:0 8px 45px rgba(255,23,68,.7); }
  }
  .logo svg{ width:30px; height:30px; }

  .title{
    font-size:22px;
    font-weight:700;
    letter-spacing:.5px;
    margin-bottom:6px;
  }
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:.3px;
  }

  /* ============ INPUT ============ */
  .input-group{
    position:relative;
    margin-bottom:22px;
  }
  .input-group .icon-left{
    position:absolute;
    left:16px; top:50%;
    transform:translateY(-50%);
    opacity:.5;
    pointer-events:none;
  }
  .input-group input{
    width:100%;
    padding:15px 46px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    color:#fff;
    font-size:14px;
    outline:none;
    transition:border-color .3s ease, box-shadow .3s ease, background .3s ease;
    letter-spacing:.5px;
  }
  .input-group input::placeholder{
    color:rgba(255,255,255,.32);
  }
  .input-group input:focus{
    border-color:var(--red-1);
    background:rgba(255,23,68,.04);
    box-shadow:0 0 0 4px rgba(255,23,68,.12);
  }
  .toggle-eye{
    position:absolute;
    right:14px; top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    opacity:.5;
    transition:opacity .2s ease;
    background:none; border:none;
    display:flex;
  }
  .toggle-eye:hover{ opacity:.9; }

  /* shake animation on error */
  .shake{
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }

  /* ============ BUTTON ============ */
  .btn-login{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.5px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,var(--red-1),var(--red-2));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 10px 24px rgba(255,23,68,.25);
  }
  .btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px rgba(255,23,68,.45);
  }
  .btn-login:active{
    transform:translateY(0);
  }
  .btn-login:disabled{
    cursor:not-allowed;
    opacity:.85;
  }

  .spinner{
    width:16px; height:16px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    display:none;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  /* ============ FOOTER ============ */
  .footer{
    text-align:center;
    margin-top:26px;
    font-size:11px;
    color:rgba(255,255,255,.4);
    letter-spacing:.3px;
    line-height:1.6;
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;
    left:50%;
    bottom:40px;
    transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,#ff1744,#c4123a);
    color:#fff;
    padding:14px 22px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.3px;
    box-shadow:0 10px 30px rgba(255,23,68,.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    z-index:999;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:480px){
    .login-card{
      padding:32px 22px 26px;
      border-radius:22px;
    }
    .title{ font-size:20px; }
  }

  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="login-card">

    <!-- LIVE badge -->
    <div class="badge-live"><span class="dot"></span>LIVE</div>

    <!-- Header -->
    <div class="header">
      <div class="logo">
        <!-- key/shield icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="#fff" fill-opacity="0.95"/>
          <path d="M9.5 12.5l1.8 1.8L14.8 10" stroke="#ff1744" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title">VCX Proxy</div>
      <div class="subtitle">Secure Access Panel</div>
    </div>

    <!-- Input Access Key -->
    <div class="input-group" id="inputGroup">
      <span class="icon-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 7a4 4 0 10-3.874 3.995L7 15v2h2v-2h2v-2h1l1.126-1.126A4 4 0 0015 7z"
            stroke="#ff4569" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <input type="password" id="accessKey" placeholder="Enter Access Key" autocomplete="off">
      <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show/Hide key">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="#fff" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="1.5"/>
        </svg>
      </button>
    </div>

    <!-- Login button -->
    <button class="btn-login" id="loginBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Login</span>
    </button>

    <!-- Footer -->
    <div class="footer">
      Encrypted Authentication<br>
      Version 2.4.1
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">❌ Invalid Access Key</div>

<script>
  // ====== ELEMENTS ======
  const accessKeyInput = document.getElementById('accessKey');
  const toggleEye = document.getElementById('toggleEye');
  const eyeIcon = document.getElementById('eyeIcon');
  const loginBtn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');
  const toast = document.getElementById('toast');
  const inputGroup = document.getElementById('inputGroup');

  // ====== SHOW / HIDE PASSWORD ======
  toggleEye.addEventListener('click', () => {
    const isPassword = accessKeyInput.type === 'password';
    accessKeyInput.type = isPassword ? 'text' : 'password';

    // swap icon style slightly (open / closed eye)
    eyeIcon.innerHTML = isPassword
      ? '<path d="M3 3l18 18" stroke="#fff" stroke-width="1.5"/><path d="M1 12s4-7 11-7c2 0 3.7.6 5.1 1.4M23 12s-4 7-11 7c-2 0-3.7-.6-5.1-1.4" stroke="#fff" stroke-width="1.5"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="1.5"/>';
  });

  // ====== GANTI SESUAI KEY VALID KAMU ======
  const VALID_KEY = "VCX-PREMIUM-2024";

  // ====== LOGIN HANDLER ======
  loginBtn.addEventListener('click', () => {
    const key = accessKeyInput.value.trim();

    if (!key) {
      showToast();
      shakeInput();
      return;
    }

    if (key !== VALID_KEY) {
      showToast();
      shakeInput();
      return;
    }

    startLoading();
  });

  // allow Enter key to submit
  accessKeyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
  });

  // ====== LOADING STATE ======
  function startLoading(){
    loginBtn.disabled = true;
    spinner.style.display = 'inline-block';
    btnText.textContent = 'Authenticating...';

    setTimeout(() => {
      window.location.href = "dom.html";
    }, 1500);
  }

  // ====== ERROR TOAST ======
  function showToast(){
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // ====== SHAKE ON WRONG INPUT ======
  function shakeInput(){
    inputGroup.classList.add('shake');
    setTimeout(() => inputGroup.classList.remove('shake'), 400);
  }
</script>

</body>
</html>
