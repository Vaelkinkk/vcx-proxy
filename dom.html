<html><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCX · Proxy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #08080e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(108,92,231,0.04), transparent 60%);
        }
        .dashboard {
            max-width: 420px;
            width: 100%;
            background: rgba(16,16,28,0.92);
            backdrop-filter: blur(32px);
            border-radius: 28px;
            padding: 28px 24px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 48px 96px rgba(0,0,0,0.9);
        }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
        .brand { display:flex; align-items:center; gap:12px; }
        .brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #ff1744, #a855f7);
            border-radius: 12px;
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:18px;
        }
        .brand-text { color:#fff; font-size:18px; font-weight:700; letter-spacing:-0.5px; }
        .brand-text span { background:linear-gradient(135deg, #ff1744, #ff4569); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .status-badge { display:flex; align-items:center; gap:6px; padding:4px 14px; border-radius:12px; border:1px solid rgba(52,211,153,0.08); background:rgba(52,211,153,0.04); }
        .status-dot { width:6px; height:6px; border-radius:50%; background:#34d399; animation:pulse 2s infinite; }
        .status-text { color:#34d399; font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
        .ip-bar {
            background:rgba(255,255,255,0.02);
            border-radius:14px;
            padding:10px 14px;
            margin:10px 0 14px 0;
            display:flex; align-items:center; gap:10px;
            border:1px solid rgba(255,255,255,0.03);
        }
        .ip-bar i { color:#ff1744; font-size:12px; opacity:0.4; }
        .ip-bar .ip { color:rgba(255,255,255,0.3); font-size:12px; font-family:monospace; flex:1; }
        .ip-bar .tag { font-size:8px; padding:2px 12px; border-radius:6px; background:rgba(108,92,231,0.08); color:#ff1744; font-weight:600; letter-spacing:0.5px; }
        .proxy-btn {
            width:100%; padding:14px;
            background:linear-gradient(135deg, #ff1744, #ff4569);
            border:none; border-radius:14px;
            color:#fff; font-size:13px; font-weight:700;
            letter-spacing:1px; cursor:pointer;
            transition:0.3s; margin:6px 0 12px 0;
        }
        .proxy-btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(108,92,231,0.2); }
        .proxy-btn.active { background:linear-gradient(135deg,#34d399,#22d3ee); }
        
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0088cc, #006699);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            margin: 4px 0 2px 0;
        }
        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 136, 204, 0.3);
        }
        .telegram-btn i { font-size: 16px; }
        
        .social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s;
    margin: 4px 0;
}
.social-btn.youtube {
    background: linear-gradient(135deg, #ff0000, #cc0000);
}
.social-btn.youtube:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(255, 0, 0, 0.3);
}
.social-btn.instagram {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}
.social-btn.instagram:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(225, 48, 108, 0.3);
}
        
        .section {
            color:rgba(255,255,255,0.08);
            font-size:8px;
            text-transform:uppercase;
            letter-spacing:2px;
            font-weight:700;
            margin:16px 0 8px 0;
        }
        .grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:4px;
        }
        .item {
            background:rgba(255,255,255,0.01);
            border:1px solid rgba(255,255,255,0.03);
            border-radius:12px;
            padding:8px 10px;
            display:flex;
            align-items:center;
            gap:6px;
        }
        .item .ico { font-size:13px; width:22px; text-align:center; opacity:0.3; }
        .item .info { flex:1; }
        .item .name { color:rgba(255,255,255,0.4); font-size:10px; font-weight:600; }
        .item .desc { color:rgba(255,255,255,0.05); font-size:7px; }
        .sw {
            width:32px; height:17px;
            background:rgba(255,255,255,0.03);
            border-radius:10px;
            cursor:pointer;
            position:relative;
            transition:0.3s;
            flex-shrink:0;
            border:1px solid rgba(255,255,255,0.02);
        }
        .sw .th {
            width:13px; height:13px;
            background:rgba(255,255,255,0.05);
            border-radius:50%;
            position:absolute;
            top:1px; left:1px;
            transition:0.3s;
        }
        .sw.on { background:linear-gradient(135deg,#ff1744,#a855f7); border-color:transparent; }
        .sw.on .th { left:16px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
        .footer { text-align:center; margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.02); }
        .footer-text { color:rgba(255,255,255,0.02); font-size:8px; letter-spacing:3px; font-weight:700; }
        .footer-text span { background:linear-gradient(135deg,#ff1744,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
            background:rgba(16,16,28,0.96); border:1px solid rgba(108,92,231,0.06);
            border-radius:12px; padding:10px 20px;
            color:#fff; font-size:12px; font-weight:500;
            backdrop-filter:blur(20px);
            opacity:0; transition:opacity 0.3s;
            pointer-events:none; max-width:90%; z-index:999;
        }
        .toast.show { opacity:1; }
        @media (max-width:380px) { .grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-satellite-dish"></i></div>
                <div class="brand-text">Proxy • <span>VCX</span></div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <div class="status-text">Live</div>
            </div>
        </div>
        <div class="ip-bar">
            <i class="fas fa-network-wired"></i>
            <span class="ip" id="ipDisplay">103.151.93.103</span>
            <span class="tag"><i class="fas fa-key"></i> Authorized</span>
        </div>
        <button class="proxy-btn" id="proxyBtn" onclick="toggleProxy()"><i class="fas fa-play"></i> Start Proxy</button>
        
        <div class="section"><i class="fas fa-crosshairs"></i> Aim Assist</div>
        <div class="grid">
            <div class="item">
                <div class="ico" style="color:#ff1744;"><i class="fas fa-crosshairs"></i></div>
                <div class="info"><div class="name">HS NECK</div><div class="desc">Headshot</div></div>
                <div class="sw" id="sw_hs_neck" onclick="toggle('hs_neck')"><div class="th"></div></div>
            </div>
            <div class="item">
                <div class="ico" style="color:#a78bfa;"><i class="fas fa-bullseye"></i></div>
                <div class="info"><div class="name">HS CHEST</div><div class="desc">Chest</div></div>
                <div class="sw" id="sw_hs_chest" onclick="toggle('hs_chest')"><div class="th"></div></div>
            </div>
        </div>

        <div class="section"><i class="fas fa-sliders-h"></i> Configuration</div>
        <div class="grid">
            <div class="item">
                <div class="ico" style="color:#ffd166;"><i class="fas fa-shield-alt"></i></div>
                <div class="info"><div class="name">BYPASS</div><div class="desc">Bypass V1</div></div>
                <div class="sw" id="sw_bypass_v1" onclick="toggle('bypass_v1')"><div class="th"></div></div>
            </div>
            <div class="item">
                <div class="ico" style="color:#f87171;"><i class="fas fa-arrow-up"></i></div>
                <div class="info"><div class="name">BACKJUMP</div><div class="desc">Jump</div></div>
                <div class="sw" id="sw_backjump_v1" onclick="toggle('backjump_v1')"><div class="th"></div></div>
            </div>
            <div class="item">
                <div class="ico" style="color:#f472b6;"><i class="fas fa-sliders-h"></i></div>
                <div class="info"><div class="name">HIGH SENSI</div><div class="desc">Sensitivity</div></div>
                <div class="sw" id="sw_high_sensi" onclick="toggle('high_sensi')"><div class="th"></div></div>
            </div>
        </div>

        <a href="https://t.me/+uEc9_y-CcRIyMTY1" target="_blank" class="telegram-btn">
            <i class="fab fa-telegram-plane"></i> Join Telegram
        </a>

        <a href="https://youtube.com/@s3xzr?si=LhRPsQ9LKCoB-l3o" target="_blank" class="social-btn youtube">
            <i class="fab fa-youtube"></i> Subscribe YouTube
        </a>

        <a href="https://www.instagram.com/s3_aronnak?igsh=cWdib295YWhmbDdh" target="_blank" class="social-btn instagram">
            <i class="fab fa-instagram"></i> Follow Instagram
        </a>

        <div class="footer"><div class="footer-text"><span>VCX</span> · PROXY</div></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let proxyActive = false;

        function toast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.className = 'toast show';
            clearTimeout(t._h);
            t._h = setTimeout(() => t.className = 'toast', 1800);
        }

        // Safe IP check
        fetch('/api/ip/check').then(r => r.json()).then(d => {
            const el = document.getElementById('ipDisplay');
            if (el && d && d.ip) el.textContent = d.ip;
        }).catch(()=>{});

        // Get initial status and set switches
        fetch('/api/status').then(r => r.json()).then(d => {
            const c = d.config || {};
            const mapping = {
                hs_neck: !!c.HS_NECK,
                hs_chest: !!c.HS_CHEST,
                bypass_v1: !!c.BYPASSV1,
                backjump_v1: !!c.BACKJUMPV1,
                high_sensi: !!c.HIGH_SENSI
            };
            Object.keys(mapping).forEach(k => {
                const el = document.getElementById('sw_' + k);
                if (el) el.className = 'sw' + (mapping[k] ? ' on' : '');
            });
        }).catch(()=>{});

        function toggleProxy() {
            proxyActive = !proxyActive;
            const btn = document.getElementById('proxyBtn');
            if (!btn) return;
            if (proxyActive) {
                btn.innerHTML = '<i class="fas fa-circle"></i> Active';
                btn.className = 'proxy-btn active';
                toast('Proxy active');
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> Start Proxy';
                btn.className = 'proxy-btn';
                toast('Proxy stopped');
            }
        }

        function toggle(feature) {
            const el = document.getElementById('sw_' + feature);
            if (!el) {
                toast('Element not found: ' + feature);
                return;
            }

            const wasOn = el.classList.contains('on');
            const newVal = !wasOn;
            // optimistically update UI
            el.classList.toggle('on', newVal);
            el.style.pointerEvents = 'none';

            // map feature to server key
            const serverKeyMap = {
                hs_neck: 'HS_NECK',
                hs_chest: 'HS_CHEST',
                bypass_v1: 'BYPASSV1',
                backjump_v1: 'BACKJUMPV1',
                high_sensi: 'HIGH_SENSI'
            };
            const serverFeature = serverKeyMap[feature] || feature.toUpperCase();

            fetch('/api/toggle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({feature: serverFeature, value: newVal})
            }).then(r => r.json()).then(d => {
                if (d && d.success) {
                    toast(feature.toUpperCase() + ' ' + (newVal ? 'ON' : 'OFF'));
                } else {
                    // revert
                    el.classList.toggle('on', !newVal);
                    toast('Gagal mengubah ' + feature.toUpperCase());
                }
            }).catch(() => {
                el.classList.toggle('on', !newVal);
                toast('Error koneksi');
            }).finally(() => {
                el.style.pointerEvents = '';
            });
        }
    </script>
</body>
</html>
